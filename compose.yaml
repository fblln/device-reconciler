# ============================================================================
# One command brings up the whole system: `docker compose up -d --wait`
# (or `npm run up`). Postgres, Eclipse Ditto as the twin store, the simulated
# aggregator platform, and the reconciler.
# No cloud service, no credentials, no vendor account, no hardware.
#
# `--wait` is load-bearing for the agentic-devex requirement: it returns only
# once every service reports HEALTHY, so a script or an agent can bring the
# stack up and immediately start asserting without a sleep. That only works
# because every service below has a real health check — which is also why the
# health checks get as much comment as they do.
# ============================================================================

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: reconciler
      POSTGRES_PASSWORD: reconciler
      POSTGRES_DB: reconciler
    ports: ['5432:5432']
    # `pg_isready` ships in the image, speaks the Postgres protocol, and opens no
    # socket from a shell. It is the probe to reach for here precisely because it
    # proves readiness rather than listening: the server accepts connections AND
    # answers. The alternative people reach for in a stripped image is
    # `bash -c '< /dev/tcp/...'`, which is indistinguishable from a reverse shell
    # to a runtime sensor — see the note in the Dockerfile. Where no such tool
    # exists, the next best probe is a /proc/net/tcp grep in exec form, because
    # reading a file is not opening a socket.
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'reconciler', '-d', 'reconciler']
      interval: 2s
      timeout: 3s
      retries: 15

  # --------------------------------------------------------------------------
  # THE TWIN STORE: Eclipse Ditto.
  #
  # Ditto stores reported state (from the device) separately from desired state
  # (set by a backend), persists both and indexes them — and its own docs say
  # the logic for reconciling the two "is up to your application or device
  # firmware". The `reconciler` service below is that application. Running
  # against the project whose documentation asks for this loop is worth more
  # than running against a fake that agrees with me by construction.
  #
  # FOUR SERVICES, NOT NINE. Ditto's own compose deployment runs policies,
  # things, things-search, connectivity, gateway, two UIs and an nginx doing
  # basic auth. Dropped here:
  #   nginx        its only job is to authenticate and forward the identity as
  #                `x-ditto-pre-authenticated: nginx:<user>`. The gateway below
  #                has ENABLE_PRE_AUTHENTICATION=true and the client sends that
  #                header itself, so nginx, its htpasswd, its mime.types and its
  #                CORS config all go. Same trust model on a local network with
  #                no published gateway port: whoever can reach it is trusted.
  #   things-search  only needed for RQL search queries. This reconciler
  #                addresses things by id and never searches.
  #   connectivity   only needed for Ditto's own inbound/outbound connections
  #                (AMQP, MQTT, Kafka). We speak to the HTTP API directly.
  #   the two UIs  useful for a human, dead weight for `--wait`.
  #
  # That is the difference between a stack an agent can bring up in a loop and
  # one it cannot.
  # --------------------------------------------------------------------------
  mongodb:
    # 7.0 because that is what Ditto's own deployment/docker/docker-compose.yml
    # pins on master, i.e. the version Ditto 3.9 is actually tested against.
    # This repository's rule is to run the latest of everything it owns; a
    # transitive dependency of somebody else's product is not one of those, and
    # chasing MongoDB 9 here would mean debugging Ditto rather than this.
    image: mongo:7.0
    # --noscripting: Ditto never needs server-side JS, and leaving it on is a
    # remote-code-execution surface in exchange for nothing. Ditto's own compose
    # file sets the same flag.
    command: mongod --storageEngine wiredTiger --noscripting
    # No published port. Nothing outside the compose network has any business
    # talking to the twin store's database, and an exposed unauthenticated
    # MongoDB is the oldest mistake in this genre.
    healthcheck:
      # `mongosh` ships in the image and speaks the wire protocol, so this
      # proves the server answers rather than that a port is bound. A real
      # client, not a shell holding a socket — see the Dockerfile.
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1}).ok']
      interval: 3s
      timeout: 5s
      retries: 20

  ditto-policies:
    image: eclipse/ditto-policies:3.9.8
    # THE NETWORK ALIAS IS LOAD-BEARING, and leaving it out is why this stack
    # first refused to start. Ditto's services form a Pekko cluster and find
    # each other by DNS: cluster bootstrap resolves `ditto-cluster` and waits
    # for at least two contact points before forming. Every Ditto service
    # therefore answers to that same alias, which is exactly what Ditto's own
    # compose file does. Without it the log reads
    # "Discovered [0] contact points, confirmed [0], which is less than the
    # required [2], retrying" — forever, with a container that never turns
    # healthy and never says why in terms of anything you configured.
    networks:
      default:
        aliases: ['ditto-cluster']
    environment: &ditto_env
      BIND_HOSTNAME: 0.0.0.0
      MONGO_DB_HOSTNAME: mongodb
      # Single-node: Pekko clustering is pointless here and its failure detector
      # will otherwise spend the first two minutes deciding whether it is alone.
      JAVA_TOOL_OPTIONS: >-
        -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=40 -Xss512k
        -Dpekko.cluster.downing-provider-class=
        -Dpekko.coordinated-shutdown.exit-jvm=on
    depends_on:
      mongodb: { condition: service_healthy }
    healthcheck:
      # Ditto's images ship curl and its services serve /alive on 7626. This is
      # the probe Ditto's own compose file uses, and it is a real HTTP client
      # rather than a shell redirection into /dev/tcp.
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:7626/alive']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  ditto-things:
    image: eclipse/ditto-things:3.9.8
    # THE NETWORK ALIAS IS LOAD-BEARING, and leaving it out is why this stack
    # first refused to start. Ditto's services form a Pekko cluster and find
    # each other by DNS: cluster bootstrap resolves `ditto-cluster` and waits
    # for at least two contact points before forming. Every Ditto service
    # therefore answers to that same alias, which is exactly what Ditto's own
    # compose file does. Without it the log reads
    # "Discovered [0] contact points, confirmed [0], which is less than the
    # required [2], retrying" — forever, with a container that never turns
    # healthy and never says why in terms of anything you configured.
    networks:
      default:
        aliases: ['ditto-cluster']
    environment: *ditto_env
    depends_on:
      # service_started, NOT service_healthy, and that is the second thing this
      # stack taught me. A Ditto service only becomes healthy once the Pekko
      # cluster has formed, and the cluster needs two contact points to form —
      # so waiting for policies to be HEALTHY before starting things means
      # policies waits for a peer that is waiting for policies. One contact
      # point, forever. Ditto's own compose file uses plain `depends_on` here
      # for exactly this reason; mongodb is the only thing worth waiting on.
      mongodb: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:7626/alive']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  ditto:
    image: eclipse/ditto-gateway:3.9.8
    # THE NETWORK ALIAS IS LOAD-BEARING, and leaving it out is why this stack
    # first refused to start. Ditto's services form a Pekko cluster and find
    # each other by DNS: cluster bootstrap resolves `ditto-cluster` and waits
    # for at least two contact points before forming. Every Ditto service
    # therefore answers to that same alias, which is exactly what Ditto's own
    # compose file does. Without it the log reads
    # "Discovered [0] contact points, confirmed [0], which is less than the
    # required [2], retrying" — forever, with a container that never turns
    # healthy and never says why in terms of anything you configured.
    networks:
      default:
        aliases: ['ditto-cluster']
    environment:
      <<: *ditto_env
      # The whole reason nginx is absent. With this on, the gateway trusts an
      # `x-ditto-pre-authenticated: <issuer>:<subject>` header, which is exactly
      # what Ditto's own nginx.conf injects from $remote_user after basic auth.
      ENABLE_PRE_AUTHENTICATION: 'true'
      DEVOPS_PASSWORD: foobar
    depends_on:
      # Again service_started: see the note on ditto-things. The gateway is the
      # one Ditto service with a health check anything else waits on, and it
      # turns healthy only once the cluster is up — which is precisely the
      # signal the reconciler wants.
      mongodb: { condition: service_healthy }
    ports: ['8080:8080']
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:7626/alive']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  # --------------------------------------------------------------------------
  # THE EDGE TIER: Eclipse Kanto. OPT-IN, via `docker compose --profile edge up`.
  #
  # Kanto is the on-device half of this architecture: it runs on a device or
  # gateway and keeps a LOCAL digital twin that works offline, synchronising in
  # both directions when the link comes back — the cloud sets desired
  # properties, the edge reports features and values. That is exactly the twin
  # semantics this repository is about, at the other end of the wire.
  #
  # WHAT IS VERIFIED, by running it: the two containers below start, Kanto's
  # local-digital-twins connects to a plain `tcp://` broker with no TLS, no
  # Eclipse Hono and no AWS, and it subscribes and publishes on Hono's MQTT
  # topics (`e/#`, `t/#`, `command//+/req/#`, `edge/thing/request`) carrying
  # ECLIPSE DITTO PROTOCOL envelopes — its go.mod requires
  # `eclipse/ditto-clients-golang` and it implements Ditto's topic criteria.
  # So the protocol match with the cloud twin is real, not hoped for.
  #
  # WHAT IS NOT WIRED, and why it is not pretended: bridging this broker to the
  # Ditto instance above needs Ditto to open an `mqtt-5` CONNECTION, and Ditto's
  # connections live in its `connectivity` service — one of the two services
  # this compose file deliberately omits to keep `--wait` fast. Adding it back
  # is the next step and it is a known quantity; claiming the round trip works
  # before running it would not be.
  #
  # Kanto publishes no container image at all (releases are .deb/.rpm/.tar.gz
  # for linux x86_64/arm64/armv7, built to be installed as systemd units on a
  # device), so kanto/Dockerfile downloads the release tarball and copies out
  # the static Go binary. That is the honest cost of putting it in Compose.
  #
  # WHY THE SIMULATED FLEET STAYS. Kanto gives realism; it does not give
  # controllable failure injection. Clock skew of ten minutes, telemetry
  # delivered out of order, a duplicate webhook, a device that acknowledges and
  # never applies, half a fleet that reports a counter and half that does not —
  # none of that can be asked of real software on demand, and all of it is the
  # pathology matrix the tests are worth running for. So: a deterministic
  # simulator for the matrix, real software pointed at once to show the
  # integration is not fiction. The sibling repository documents the same split.
  # --------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    profiles: ['edge']
    volumes:
      - ./kanto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # A /proc/net/tcp grep in EXEC form, because this image ships neither curl
      # nor an HTTP endpoint to curl — the broker speaks MQTT, not HTTP. 075B is
      # 1883 in hex and 0A is the listening state; `0*:0000` matches a remote
      # address of any padding.
      #
      # Reading a file is not opening a socket. The conventional answer for an
      # image with no HTTP client is `bash -c '< /dev/tcp/127.0.0.1/1883'`, and
      # that is byte-for-byte the construct every reverse-shell detection rule
      # in the industry is written against — a process wiring one of its own
      # standard streams to a network connection. It raises a High-severity
      # finding on a monitored CI runner and a sensor cannot tell it from an
      # intrusion, because the only difference is the destination. See the
      # Dockerfile, and "The Health Check Was a Reverse Shell" on fblln.github.io.
      test: ['CMD', 'grep', '-q', ':075B 0*:0000 0A', '/proc/net/tcp']
      interval: 2s
      timeout: 3s
      retries: 15

  kanto-edge:
    build: ./kanto
    profiles: ['edge']
    depends_on:
      mosquitto: { condition: service_healthy }
    entrypoint: ['/run.sh']
    volumes:
      - ./kanto/run.sh:/run.sh:ro
    environment:
      # Two broker addresses, one broker. In a real deployment the local broker
      # is on the device and the hub is elsewhere; here they are the same
      # Mosquitto, separated by topic. Plain tcp:// on purpose — Kanto only
      # demands a CA certificate when the scheme is a secure one, which is what
      # makes a fully local, credential-free edge tier possible at all.
      KANTO_HUB_ADDRESS: tcp://mosquitto:1883
      KANTO_LOCAL_ADDRESS: tcp://mosquitto:1883
      KANTO_TENANT: energy
      # namespace:name, because a Ditto thing id is exactly that and Kanto's
      # twin is addressed by the same identifier the cloud twin uses.
      KANTO_DEVICE_ID: energy:edge-0001
      KANTO_AUTH_ID: edge_0001
      KANTO_PASSWORD: secret
      KANTO_POLICY_ID: energy:edge-0001
      KANTO_LOG_LEVEL: INFO

  platform:
    build: .
    command: ['node', '/app/src/platform/main.ts']
    environment:
      PORT: '9900'
      # The simulated fleet is a pure function of SEED: same seed, same clock
      # skews, latencies and pathologies. An integration failure is replayable.
      SEED: '20261107'
      FLEET_SIZE: '24'
      # The compressed timeline. Real feeds run on minutes; this runs on
      # seconds so the fleet converges while someone is watching. The RATIOS
      # between capture interval, latency and actuation delay are preserved —
      # see the note in src/platform/sim.ts.
      TICK_MS: '1000'
      CLIENT_ID: reconciler
      CLIENT_SECRET: dev-client-secret
      WEBHOOK_SECRET: dev-webhook-secret
      # Service name, not localhost: a webhook posted to localhost from inside a
      # container reaches that container and nothing is ever delivered.
      WEBHOOK_URL: http://reconciler:9910/webhooks
    ports: ['9900:9900']
    healthcheck:
      test: ['CMD', 'node', '/app/src/platform/healthcheck.ts']
      interval: 2s
      timeout: 3s
      retries: 15

  reconciler:
    build: .
    command: ['node', '/app/src/app.ts']
    depends_on:
      postgres: { condition: service_healthy }
      # Not service_healthy: the reconciler retries the platform on its own
      # (that is what the breaker and the backoff are for), so making it wait
      # here would only hide whether that retry path works.
      platform: { condition: service_started }
      # service_healthy here, unlike the platform: the twin is created once per
      # device when it is first registered, and a gateway that is not yet up
      # would mean the first sweep logs twin.publish.failed for the whole fleet
      # and those things are only created on the next restart. Cheap to wait for
      # at startup, annoying to debug otherwise.
      ditto: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://reconciler:reconciler@postgres:5432/reconciler
      # The twin store. Absent in this variable's default, so tests and a bare
      # `node src/app.ts` need no Ditto; set here because compose has one.
      DITTO_URL: http://ditto:8080
      DITTO_NAMESPACE: energy
      DITTO_SUBJECT: nginx:ditto
      PLATFORM_URL: http://platform:9900
      PLATFORM_CLIENT_ID: reconciler
      PLATFORM_CLIENT_SECRET: dev-client-secret
      WEBHOOK_SECRET: dev-webhook-secret
      PORT: '9910'
      PUBLIC_URL: http://reconciler:9910
      # Scaled to the platform's compressed timeline: a command timeout of three
      # real minutes against a four-second capture interval would never fire, and
      # the timeout path is one of the things worth watching.
      COMMAND_TIMEOUT_MS: '20000'
      SKEW_BOUND_MS: '2000'
      MAX_LATENCY_MS: '4000'
      SWEEP_INTERVAL_MS: '5000'
      FAILED_INTERVAL_MS: '60000'
      VENDOR_RPS: '5'
      VENDOR_BURST: '10'
      SEED: '20261107'
      # The shared health-check script reads this; without it the script would
      # probe the platform's default port from inside the reconciler container.
      HEALTHCHECK_URL: http://127.0.0.1:9910/readyz
    ports:
      - '9910:9910'
      # The Prometheus endpoint. A pull exporter needs nothing on the other end,
      # which is why this repository has no collector: curl is a sufficient
      # backend. See src/telemetry.ts.
      - '9911:9911'
    healthcheck:
      test: ['CMD', 'node', '/app/src/platform/healthcheck.ts']
      interval: 2s
      timeout: 3s
      retries: 15
      # The reconciler's own port, not the platform's.
      start_period: 5s
